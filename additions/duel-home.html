<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>标风 1v1 · 无名杀</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 20px; background: radial-gradient(ellipse at 50% 0%, #34414b, transparent 65%), #111c26; color: #f4eada; font: 16px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(100%, 540px); padding: 40px 34px 28px; border: 1px solid #ddc6a640; border-radius: 24px; background: linear-gradient(145deg, #26333e, #1b2630); box-shadow: 0 24px 80px #0005; }
    .eyebrow { margin: 0 0 12px; color: #cfb48a; font-size: 13px; letter-spacing: .16em; }
    h1 { margin: 0; font: 600 clamp(32px, 8vw, 42px)/1.3 "Songti SC", "SimSun", serif; }
    .intro { color: #bac4ca; margin: 16px 0 30px; }
    .choice { display: block; margin-top: 14px; padding: 19px 22px; border: 1px solid #73818d75; border-radius: 14px; color: #f4eada; text-decoration: none; background: #101a2360; transition: background .15s; }
    .choice:first-of-type { color: #202b33; background: #dec098; border-color: #dec098; }
    .choice:hover { background: #32424e; }
    .choice:first-of-type:hover { background: #f0d1a8; }
    .choice strong { display: block; font-size: 20px; }
    .choice span { display: block; margin-top: 4px; font-size: 14px; opacity: .8; }
    .rules { margin: 28px 0 0; color: #aab7c0; font-size: 13px; }
    .more { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 22px; }
    .more a { color: #aab7c0; font-size: 13px; text-underline-offset: 4px; padding: 6px 0; }
    a:focus-visible { outline: 3px solid #f0cb8d; outline-offset: 4px; }
    @media (max-width: 420px) { main { padding: 30px 24px 24px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">无名杀 · 经典单挑</p>
    <h1>标风 1v1</h1>
    <p class="intro">想先练一局，还是和她一起玩？</p>
    <a class="choice" href="/?play=ai"><strong>和电脑玩</strong><span>直接开始标风人机，无需建房或等待。</span></a>
    <a class="choice" href="/?quick=host"><strong>邀请另一人</strong><span>创建双人对局，分享链接，两人到齐自动开始。</span></a>
    <p class="rules">标准＋风包 · 默认四禁 · 六明四暗选将<br>各选五将，三将依次上场。</p>
    <nav class="more" aria-label="更多"><a href="/?play=hall">普通联机大厅</a><a href="https://github.com/XunZhiyang/noname-duel-cloud">源代码 · GPLv3</a></nav>
  </main>
</body>
</html>
